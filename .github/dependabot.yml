# Avisos de actualizaciones de dependencias (abre pull requests; nada se publica solo: sólo `main` publica).
# Las versiones mayores (React 19, Vite 8, Tailwind 4, TypeScript 7…) se hacen a mano, cada una en su rama con
# las pruebas e2e; Tailwind 4 además requiere revisión de diseño. Ver README → «Dependencias».
version: 2
updates:
  - package-ecosystem: npm
    directory: /interfaz-redes-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
